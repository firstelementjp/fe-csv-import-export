name: Create Release ZIP

on:
    push:
        tags: ['v*']
    release:
        types: [published]

permissions:
    contents: read

concurrency:
    group: release-zip-${{ github.ref }}
    cancel-in-progress: true

jobs:
    create-zip:
        runs-on: ubuntu-latest
        if: github.repository == 'firstelementjp/fe-csv-import-export'
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build assets
              run: npm run build

            - name: Create ZIP
              id: create_zip
              run: |
                  rm -rf release
                  mkdir -p release
                  ZIP_VERSION="${GITHUB_REF_NAME#v}"
                  ZIP_FILE="fe-csv-import-export-${ZIP_VERSION}.zip"

                  # Create release tree from git (respects .gitattributes export-ignore).
                  git archive --format=tar --prefix=fe-csv-import-export/ --worktree-attributes ${{ github.ref_name }} | tar -x -C release

                  # Copy built/minified assets from working directory into the release tree.
                  mkdir -p release/fe-csv-import-export/assets/js
                  mkdir -p release/fe-csv-import-export/assets/js/export/fe-csv-import-export
                  mkdir -p release/fe-csv-import-export/assets/css
                  cp -f assets/js/*.min.js release/fe-csv-import-export/assets/js/ || true
                  cp -f assets/js/export/fe-csv-import-export/*.min.js release/fe-csv-import-export/assets/js/export/fe-csv-import-export/ || true
                  cp -f assets/css/*.min.css release/fe-csv-import-export/assets/css/ || true

                  cd release
                  rm -f ../${ZIP_FILE}
                  zip -r ../${ZIP_FILE} fe-csv-import-export

                  echo "zip_file=${ZIP_FILE}" >> "$GITHUB_OUTPUT"

            - name: Security checks on release tree
              run: |
                  echo "=== Security checks in release tree ==="
                  echo "Files starting with underscore (should be 0):"
                  UNDERSCORE_COUNT=$(find release/fe-csv-import-export -name "_*" | wc -l)
                  echo "$UNDERSCORE_COUNT"
                  if [ "$UNDERSCORE_COUNT" -gt 0 ]; then
                      echo "ERROR: Found files starting with underscore:"
                      find release/fe-csv-import-export -name "_*"
                      exit 1
                  fi

                  echo "Files starting with dot (should be 0):"
                  DOT_COUNT=$(find release/fe-csv-import-export -name ".*" | wc -l)
                  echo "$DOT_COUNT"
                  if [ "$DOT_COUNT" -gt 0 ]; then
                      echo "ERROR: Found files starting with dot:"
                      find release/fe-csv-import-export -name ".*"
                      exit 1
                  fi

            - name: Create Release
              uses: softprops/action-gh-release@v3
              with:
                  files: ${{ steps.create_zip.outputs.zip_file }}
                  generate_release_notes: true
                  draft: false
                  prerelease: false

    announce:
        name: Announce Release
        # Self-hosted runner: the company site blocks overseas IPs, and
        # GitHub-hosted runners run in Azure US regions.
        runs-on: [self-hosted, macOS]
        needs: create-zip
        # Announcement integrations are opt-in via repository variables/secrets.
        if: github.repository == 'firstelementjp/fe-csv-import-export' && (vars.WP_BASE_URL != '' || vars.ENABLE_X_POST == 'true')
        env:
            PLUGIN_NAME: FE CSV Import & Export
            WP_BASE_URL: ${{ vars.WP_BASE_URL }}
            WP_CATEGORY_ID: ${{ vars.WP_CATEGORY_ID }}
            WP_JA_CATEGORY_ID: ${{ vars.WP_JA_CATEGORY_ID }}
            WP_EN_CATEGORY_ID: ${{ vars.WP_EN_CATEGORY_ID }}
            WP_USERNAME: ${{ secrets.WP_USERNAME }}
            WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
            X_API_KEY: ${{ secrets.X_API_KEY }}
            X_API_SECRET: ${{ secrets.X_API_SECRET }}
            X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
            X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
            ENABLE_X_POST: ${{ vars.ENABLE_X_POST }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Create WordPress draft posts
              if: env.WP_BASE_URL != '' && env.WP_USERNAME != '' && env.WP_APP_PASSWORD != ''
              run: bash .github/scripts/announce-release.sh

            - name: Post to X (or write draft texts to summary)
              run: |
                  RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"

                  JA_TEXT="${PLUGIN_NAME} ${GITHUB_REF_NAME} をリリースしました。
                  詳細はリリースノートをご覧ください。
                  ${RELEASE_URL}
                  #WordPress #CSV"
                  EN_TEXT="${PLUGIN_NAME} ${GITHUB_REF_NAME} is now available.
                  See the release notes for details:
                  ${RELEASE_URL}
                  #WordPress #CSV"

                  if [ "${ENABLE_X_POST}" = "true" ] && [ -n "${X_API_KEY}" ]; then
                      npm install --silent twitter-api-v2@1
                      POST_TEXT="${JA_TEXT}" node .github/scripts/post-x.mjs
                      POST_TEXT="${EN_TEXT}" node .github/scripts/post-x.mjs
                  else
                      {
                          echo "### Draft X posts (review and post manually)"
                          echo ''
                          echo '```'
                          echo "${JA_TEXT}"
                          echo '```'
                          echo ''
                          echo '```'
                          echo "${EN_TEXT}"
                          echo '```'
                      } >> "${GITHUB_STEP_SUMMARY}"
                      echo "X auto-post disabled or credentials missing; draft texts written to the job summary."
                  fi

    deploy-to-svn:
        name: Deploy to WordPress.org SVN
        runs-on: ubuntu-latest
        needs: create-zip
        # Runs only when explicitly enabled via the WORDPRESS_ORG_SVN_ENABLED
        # repository variable and SVN credentials are configured.
        if: github.repository == 'firstelementjp/fe-csv-import-export' && startsWith(github.ref, 'refs/tags/v') && vars.WORDPRESS_ORG_SVN_ENABLED == 'true'

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build assets
              run: npm run build

            - name: Create release tree
              run: |
                  rm -rf release
                  mkdir -p release

                  # Create release tree from git (respects .gitattributes export-ignore).
                  git archive --format=tar --prefix=fe-csv-import-export/ --worktree-attributes ${{ github.ref_name }} | tar -x -C release

                  # Copy built/minified assets from working directory into the release tree.
                  mkdir -p release/fe-csv-import-export/assets/js
                  mkdir -p release/fe-csv-import-export/assets/js/export/fe-csv-import-export
                  mkdir -p release/fe-csv-import-export/assets/css
                  cp -f assets/js/*.min.js release/fe-csv-import-export/assets/js/ || true
                  cp -f assets/js/export/fe-csv-import-export/*.min.js release/fe-csv-import-export/assets/js/export/fe-csv-import-export/ || true
                  cp -f assets/css/*.min.css release/fe-csv-import-export/assets/css/ || true

            - name: Deploy to WordPress.org
              uses: 10up/action-wordpress-plugin-deploy@stable
              env:
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SLUG: fe-csv-import-export
                  # Deploy the same tree that goes into the release ZIP. This
                  # bypasses .gitattributes/.distignore handling, which would
                  # otherwise exclude the .min.js assets copied back above.
                  BUILD_DIR: release/fe-csv-import-export
